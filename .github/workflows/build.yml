name: Build

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all Minecraft versions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build and test every Minecraft target
        # The root build includes all versions in gradle.properties: minecraft_targets.
        # Continue independent targets after failures to report as many problems as possible.
        run: ./gradlew build --continue --no-daemon --stacktrace -Pdevauth=false
